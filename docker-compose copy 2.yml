services:
  backend:
    build:
      context: ./noted-backend
      dockerfile: Dockerfile
    container_name: noted-backend
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-true}
      - DOMAIN=${DOMAIN:-localhost}
      - DATABASE_URL=sqlite+aiosqlite:///./noted.db
      - HF_TOKEN=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
      - DEMO_LOGIN=${DEMO_LOGIN:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-demo1}
      - QDRANT_URL=http://qdrant:6333
      # Ollama endpoints (running on host)
      - LLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - SUMMARY_MODEL=${SUMMARY_MODEL:-gemma2:2b}
      - LLAMA_EMBED_URL=http://host.docker.internal:11434/v1
      - LLAMA_API_KEY=ollama
      # Disable ASR/diarization
      - ASR_BATCH_URL=http://disabled:8000
      - ASR_BATCH_MODEL=none
      - DIARIZATION_URL=http://disabled:8010
      - DIARIZATION_MODEL=none
      - ASR_BATCH_CONCURRENCY=8
      - DIARIZATION_MAX_SPEAKERS=2
      - UPLOAD_CHUNK_DURATION=300
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - noted-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - noted-network
    expose:
      - "6333"
      - "6334"
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./noted-frontend
      dockerfile: Dockerfile
      args:
        VITE_DOMAIN: ${DOMAIN:-localhost}
        VITE_APP_BASE: /                     # hardcoded to root – fixes 404
    container_name: noted-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - noted-network

networks:
  noted-network:
    name: noted-network
    driver: bridge