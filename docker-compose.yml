services:
  backend:
    build:
      context: ./noted-backend
      dockerfile: Dockerfile
    container_name: noted-backend
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-true}
      - DOMAIN=${DOMAIN:-localhost}
      - DATABASE_URL=sqlite+aiosqlite:///./noted.db
      - HF_TOKEN=${HF_TOKEN}
      - DEMO_LOGIN=${DEMO_LOGIN:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-demo1}
      - QDRANT_URL=http://qdrant:6333
      # Override config.yaml model URLs/keys from env if needed
      - LLAMA_BASE_URL=${LLAMA_BASE_URL:-http://llama-gen:8000/v1}
      - SUMMARY_MODEL=${SUMMARY_MODEL:-gemma-4-26B-A4B-it-UD-Q4_K_M.gguf}
      - LLAMA_EMBED_URL=${LLAMA_EMBED_URL:-http://vllm-embed:8000/v1}
      - LLAMA_API_KEY=${LLAMA_API_KEY:-none}
      - ASR_BATCH_URL=${ASR_BATCH_URL:-http://lightweight-speech:8020}
      - ASR_BATCH_MODEL=${ASR_BATCH_MODEL:-tiny}
      - ASR_BATCH_CONCURRENCY=${ASR_BATCH_CONCURRENCY:-8}
      - DIARIZATION_URL=${DIARIZATION_URL:-http://lightweight-speech:8020}
      - DIARIZATION_MODEL=${DIARIZATION_MODEL:-local-simple}
      - DIARIZATION_MAX_SPEAKERS=${DIARIZATION_MAX_SPEAKERS:-2}
      - UPLOAD_CHUNK_DURATION=${UPLOAD_CHUNK_DURATION:-300}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - noted-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      qdrant:
        condition: service_healthy
      lightweight-speech:
        condition: service_healthy
        
  vllm-embed:
    image: vllm/vllm-openai:latest
    container_name: vllm-embed
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen3-Embedding-0.6B
      --max-model-len 2048
      --gpu-memory-utilization 0.08
    networks:
      - noted-network
      - embed-shared
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama-gen:
    build:
      context: ./LlamaCPP
      dockerfile: Dockerfile
    container_name: llama-gen
    restart: unless-stopped
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8000
      - LLAMA_ARG_ALIAS=${SUMMARY_MODEL:-gemma-4-26B-A4B-it-UD-Q4_K_M.gguf}
      - LLAMA_ARG_CTX_SIZE=${LLAMA_CPP_CONTEXT_SIZE:-8192}
      - LLAMA_ARG_N_BATCH=${LLAMA_CPP_BATCH_SIZE:-512}
      - LLAMA_ARG_N_GPU_LAYERS=${LLAMA_CPP_GPU_LAYERS:--1}
    volumes:
      - ${LLAMA_CPP_MODEL_HOST_DIR:-/home/trustm/models}:/home/llama/models
    command: --model-path ${LLAMA_CPP_MODEL_PATH:-/home/llama/models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf}
    networks:
      - noted-network
      - llm-shared
    ports:
      - "127.0.0.1:${LLAMA_CPP_HOST_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 60s
      timeout: 5s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Batch ASR (Qwen3-ASR via vLLM) ---
  qwen3-asr:
    build:
      context: .
      dockerfile: qwen3-asr.Dockerfile
    container_name: qwen3-asr
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen3-ASR-0.6B
      --max-model-len 8192
      --gpu-memory-utilization 0.35
      --max-num-seqs 8
      --limit-mm-per-prompt '{"audio": 1}'
    networks:
      - noted-network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sortformer-diarizer:
    build:
      context: .
      dockerfile: sortformer.Dockerfile
    container_name: sortformer-diarizer
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - SORTFORMER_MODEL=${DIARIZATION_MODEL:-nvidia/diar_streaming_sortformer_4spk-v2.1}
      - DIARIZATION_DEVICE=${DIARIZATION_DEVICE:-auto}
      - DIARIZATION_MAX_SPEAKERS=${DIARIZATION_MAX_SPEAKERS:-2}
    networks:
      - noted-network
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  lightweight-speech:
    build:
      context: .
      dockerfile: lightweight-speech.Dockerfile
    container_name: lightweight-speech
    restart: unless-stopped
    environment:
      - LIGHT_ASR_MODEL=${LIGHT_ASR_MODEL:-tiny}
      - LIGHT_ASR_DEVICE=${LIGHT_ASR_DEVICE:-cpu}
      - LIGHT_ASR_COMPUTE_TYPE=${LIGHT_ASR_COMPUTE_TYPE:-int8}
    networks:
      - noted-network
    expose:
      - "8020"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - noted-network
    expose:
      - "6333"
      - "6334"
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./noted-frontend
      dockerfile: Dockerfile
      args:
        VITE_DOMAIN: ${DOMAIN:-localhost}
        VITE_APP_BASE: ${FRONTEND_BASE_PATH:-/noted/}
    container_name: noted-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - noted-network

networks:
  noted-network:
    name: noted-network
    driver: bridge
  embed-shared:
    name: noted-embed-shared
    driver: bridge
  llm-shared:
    name: noted-llm-shared
    driver: bridge
